[workspace]
resolver = "2"
members = ["crates/psx-disc", "crates/psx-index", "crates/psxvc-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
psx-disc = { path = "crates/psx-disc" }
psx-index = { path = "crates/psx-index" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
