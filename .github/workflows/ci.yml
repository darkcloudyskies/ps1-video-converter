name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      # The app is built on Windows below, since on Linux it would need WebKit.
      - run: cargo clippy --workspace --exclude psxvc-gui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude psxvc-gui
  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p psxvc-gui --all-targets -- -D warnings
